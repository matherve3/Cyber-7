{seuil:700, modules:"Defis 681-700", titre:"Niveau 7 Architecte", cert:"Advanced Civilization Leadership", url:"https://www.weforum.org/", type:"paid", desc:"Programme WEF. ~50k€."}
];

var MILESTONES = [
{seuil:620, titre:"Standard mondial cyber", date:"Apres defi 620", desc:"Standard complet + gouvernance + adoption."},
{seuil:640, titre:"Stratégie géopolitique", date:"Apres defi 640", desc:"Doctrine + alliances + attribution."},
{seuil:660, titre:"Civilisation numérique", date:"Apres defi 660", desc:"Droits + éducation + IA éthique."},
{seuil:680, titre:"Stratégie IA civilisée", date:"Apres defi 680", desc:"Alignement + interprétabilité + contrôle."},
{seuil:700, titre:"Niveau 7 Architecte - 700 défis", date:"Apres defi 700", desc:"Parcours architecte complet 700 défis."}
];

var JOBS = [
{nom:"Architecte de civilisation cyber", url:"https://www.linkedin.com/jobs/", type:"International", desc:"Influence mondiale."},
{nom:"Directeur standard mondial", url:"https://www.iso.org/", type:"Standard", desc:"ISO, NIST, IETF."},
{nom:"Conseiller ONU cyber", url:"https://www.un.org/", type:"International", desc:"Gouvernance mondiale."},
{nom:"Conseiller OTAN cyber", url:"https://www.nato.int/", type:"International", desc:"Défense collective."},
{nom:"Directeur think tank international", url:"https://www.linkedin.com/jobs/", type:"Think tank", desc:"Influence mondiale."},
{nom:"Chercheur AI safety", url:"https://www.anthropic.com/", type:"Recherche", desc:"Alignement IA."},
{nom:"Directeur AI policy", url:"https://www.linkedin.com/jobs/", type:"Policy", desc:"Régulation IA."},
{nom:"Conférencier international", url:"https://www.linkedin.com/jobs/", type:"Speaker", desc:"Conférences mondiales."}
];

var state = JSON.parse(localStorage.getItem('cyber_ci_lvl7') || '{"done":{},"exams":{}}');
if (!state.exams) state.exams = {};
Object.keys(state.done).forEach(function(id){ if (state.done[id] === true) state.done[id] = new Date().toISOString(); });
function save(){ localStorage.setItem('cyber_ci_lvl7', JSON.stringify(state)); }
var app = document.getElementById('app');

function todayKey(){ return new Date().toISOString().split('T')[0]; }
function countToday(){ var t = todayKey(); return Object.values(state.done).filter(function(v){ return typeof v === 'string' && v.startsWith(t); }).length; }
function countTotal(){ return Object.keys(state.done).length; }
function passedExamsCount(){ return Object.keys(state.exams).filter(function(k){ return state.exams[k].passed; }).length; }

function isExamUnlocked(ex){ for (var i = ex.from; i <= ex.to; i++){ if (!state.done[i]) return false; } return true; }
function isExamPassed(ex){ return !!(state.exams && state.exams[ex.id] && state.exams[ex.id].passed); }

function updateProg(){
  var done = countTotal(), today = countToday();
  document.getElementById('hs').innerHTML = "Aujourdhui : <b>" + today + "</b> · Defis : <b>" + done + "/" + D.length + "</b> · Examens : <b>" + passedExamsCount() + "/" + EXAMS.length + "</b>";
}

function render(){
  updateProg();
  var today = countToday(), total = countTotal();
  
  var html = '<div class="hero"><h2>Niveau 7 : Architecte de Civilisation <span class="level-tag l7">NIVEAU 7</span></h2><p>100 défis ultimes : Standards planétaires, Géopolitique cyber, Civilisation numérique, IA superintelligente, Postérité civilisationnelle. Objectif : Architecte de civilisation, Conseiller ONU, Chercheur AI safety, Légende mondiale.</p></div>';
  
  html += '<div class="card"><div class="stats-grid"><div class="stat"><span class="big">' + today + '</span><span class="lbl">Aujourdhui</span></div><div class="stat"><span class="big">' + total + '/100</span><span class="lbl">Defis</span></div><div class="stat"><span class="big">' + passedExamsCount() + '/5</span><span class="lbl">Examens</span></div><div class="stat"><span class="big">' + Math.round(total/D.length*100) + '%</span><span class="lbl">Progression</span></div></div>';
  html += '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="gold" onclick="showCerts()">Certifications</button><button class="gold" onclick="showStats()">Statistiques</button><button class="gold" onclick="showJobs()">Emplois</button><button class="sec" onclick="reset()">Reinitialiser</button></div></div>';
  
  var mods = [
    {n:"Module 31 - Standards planétaires", from:601, to:620, cs:620, exam:"E31"},
    {n:"Module 32 - Géopolitique cyber avancée", from:621, to:640, cs:640, exam:"E32"},
    {n:"Module 33 - Civilisation numérique & éthique", from:641, to:660, cs:660, exam:"E33"},
    {n:"Module 34 - IA superintelligente & sécurité", from:661, to:680, cs:680, exam:"E34"},
    {n:"Module 35 - Postérité civilisationnelle", from:681, to:700, cs:700, exam:"E35"}
  ];
  
  mods.forEach(function(m){
    var defis = D.filter(function(d){ return d.id >= m.from && d.id <= m.to; });
    var done = defis.filter(function(d){ return state.done[d.id]; }).length;
    var cp = CERT_PLAN.filter(function(c){ return c.seuil === m.cs; })[0];
    var exam = EXAMS.filter(function(e){ return e.id === m.exam; })[0];
    var examUnlocked = exam && isExamUnlocked(exam);
    var examPassed = exam && isExamPassed(exam);
    var status = done === defis.length ? 'done' : '';
    
    html += '<div class="card" style="border-left:4px solid #8b5cf6"><h2 style="color:#c4b5fd">' + m.n + '</h2><p style="color:#94a3b8;font-size:0.8em">' + done + '/' + defis.length + ' defis valides</p>';
    if (cp) {
      var badge = cp.type === 'free' ? 'free' : (cp.type === 'partial' ? 'partial' : 'paid');
      var badgeTxt = cp.type === 'free' ? 'GRATUIT' : (cp.type === 'partial' ? 'PARTIEL' : 'PAYANT');
      html += '<div class="cert ' + status + '"><h4>' + (status?'Debloquee':'A debloquer') + ' - ' + cp.modules + '</h4><div style="font-weight:700;margin:4px 0">' + cp.cert + ' <span class="badge ' + badge + '">' + badgeTxt + '</span></div><div style="font-size:0.85em;color:#94a3b8;margin-top:6px">' + cp.desc + '</div><div style="margin-top:6px"><a href="' + cp.url + '" target="_blank">Site officiel</a></div></div>';
    }
    html += '<div class="grid">';
    defis.forEach(function(d){
      var cls = state.done[d.id] ? 'done' : '';
      html += '<div class="btn ' + cls + '" onclick="show(' + d.id + ')"><span class="n">Defi ' + d.id + '</span><span class="ti">' + d.t + '</span></div>';
    });
    html += '</div>';
    
    if (exam) {
      var cls2 = examPassed ? 'passed' : (examUnlocked ? '' : 'locked');
      var badgeCls = examPassed ? 'passed' : (examUnlocked ? 'ready' : 'locked');
      var badgeTxt2 = examPassed ? 'REUSSI' : (examUnlocked ? 'PRET' : 'VERROUILLE');
      html += '<div class="exam-card ' + cls2 + '"><span class="exam-badge ' + badgeCls + '">' + badgeTxt2 + '</span><h4>' + exam.titre + '</h4>';
      html += '<div class="qcount">' + exam.questions.length + ' questions · Seuil : ' + Math.round(EXAM_PASS_RATIO*100) + '% · ' + exam.duree + ' min</div>';
      if (examPassed) {
        var sc = state.exams[exam.id].score;
        html += '<div style="color:#86efac;font-size:0.85em;margin-top:6px">Score : ' + sc + '/' + exam.questions.length + ' (' + Math.round(sc/exam.questions.length*100) + '%)</div>';
        html += '<div class="nav"><button class="exam" onclick="startExam(\'' + exam.id + '\')">Repasser</button></div>';
      } else if (examUnlocked) {
        html += '<div style="color:#c4b5fd;font-size:0.85em;margin-top:6px">Module complete ! Passez l\'examen.</div>';
        html += '<div class="nav"><button class="exam" onclick="startExam(\'' + exam.id + '\')">Passer l\'examen</button></div>';
      } else {
        var reste = exam.to - done;
        html += '<div style="color:#94a3b8;font-size:0.85em;margin-top:6px">Validez les ' + reste + ' defis restants pour debloquer.</div>';
      }
      html += '</div>';
    }
    
    html += '</div>';
  });
  
  app.innerHTML = html;
  window.scrollTo(0,0);
}

function show(id){
  var d = D.filter(function(x){ return x.id === id; })[0];
  if (!d) return;
  var dateValid = state.done[d.id];
  var dateStr = dateValid ? new Date(dateValid).toLocaleString('fr-FR') : '';
  
  var html = '<div class="card"><div class="meta"><small>Defi ' + d.id + '/700</small><small>' + d.d + ' min</small>' + (dateStr ? '<small style="color:#22c55e">Valide le ' + dateStr + '</small>' : '') + '<small class="level-tag l7">NIVEAU 7</small></div>';
  html += '<h2>Defi ' + d.id + ' : ' + d.t + '</h2>';
  html += '<div class="intro"><h3 style="color:#c4b5fd;margin-top:0">Introduction</h3><p>' + d.intro + '</p></div>';
  html += '<div class="analogy"><b>Analogie :</b> ' + d.analogy + '</div>';
  
  d.sections.forEach(function(s, i){
    html += '<div class="section"><h3>' + (i+1) + '. ' + s.titre + '</h3>' + s.contenu + '</div>';
  });
  
  html += '<div class="why"><b>Pourquoi en cyber :</b> ' + d.why + '</div>';
  html += '<div class="bank"><b>Pourquoi pour une banque :</b> ' + d.bank + '</div>';
  html += '<div class="glo"><b>Glossaire :</b> ' + d.glo + '</div>';
  html += '<div class="pr"><h3 style="color:#22c55e;margin-top:0">PRATIQUE</h3><ol>';
  d.pr.forEach(function(p){ html += '<li>' + p + '</li>'; });
  html += '</ol></div>';
  html += '<div class="er"><b>Erreur a eviter :</b> ' + d.er + '</div>';
  html += '<div class="df"><b>Exercice final :</b> ' + d.df + '</div>';
  html += '<div class="car"><b>Livrable portfolio :</b> ' + d.proj + '</div>';
  html += '<h3>Quiz</h3><div class="quiz" id="quiz">';
  
  d.q.forEach(function(q, i){
    html += '<div class="q"><b>Q' + (i+1) + '. ' + q.q + '</b>';
    q.a.forEach(function(opt, j){
      html += '<label><input type="radio" name="q' + i + '" value="' + j + '"> ' + opt + '</label>';
    });
    html += '<div class="exp" id="exp' + i + '"></div></div>';
  });
  
  html += '</div><div class="nav"><button class="sec" onclick="render()">Accueil</button><button onclick="validate(' + id + ')">Valider</button></div><div id="res"></div></div>';
  
  app.innerHTML = html;
  window.scrollTo(0,0);
}

function validate(id){
  var d = D.filter(function(x){ return x.id === id; })[0];
  var correct = 0;
  d.q.forEach(function(q, i){
    var sel = document.querySelector('input[name="q' + i + '"]:checked');
    var labels = document.querySelectorAll('input[name="q' + i + '"]');
    labels.forEach(function(inp, j){
      var lbl = inp.parentElement;
      if (j === q.c) lbl.classList.add('ok');
      if (sel && +sel.value === j && j !== q.c) lbl.classList.add('ko');
    });
    var exp = document.getElementById('exp' + i);
    exp.style.display = 'block';
    exp.innerHTML = q.e;
    if (sel && +sel.value === q.c) correct++;
  });
  
  var ok = correct === d.q.length;
  var dejaValide = !!state.done[id];
  document.getElementById('res').innerHTML = '<div class="res ' + (ok?'g':'r') + '">' + (ok ? 'Defi ' + d.id + ' valide !' : 'Score : ' + correct + '/' + d.q.length + ' - Reessayez') + '</div>';
  
  if (ok && !dejaValide) {
    state.done[id] = new Date().toISOString();
    save();
    updateProg();
    var exam = EXAMS.filter(function(e){ return e.from <= id && e.to >= id; })[0];
    if (exam && isExamUnlocked(exam) && !isExamPassed(exam)) {
      document.getElementById('res').innerHTML += '<div class="res g" style="margin-top:8px">Module complete ! <a href="#" onclick="startExam(\'' + exam.id + '\');return false;">Passer l\'examen final</a></div>';
    }
  }
}

var currentExam = null;

function startExam(id){
  var ex = EXAMS.filter(function(e){ return e.id === id; })[0];
  if (!ex) return;
  if (!isExamUnlocked(ex)) { alert("Validez d'abord tous les defis du module."); return; }
  currentExam = ex;
  
  var html = '<div class="card"><div class="meta"><small>Examen ' + ex.id + '</small><small>' + ex.questions.length + ' questions</small><small>Seuil ' + Math.round(EXAM_PASS_RATIO*100) + '%</small><small class="level-tag l7">NIVEAU 7</small></div>';
  html += '<h2>' + ex.titre + '</h2>';
  html += '<div class="intro"><p><b>Instructions :</b> Repondez a toutes les questions. Il faut au moins ' + Math.ceil(ex.questions.length * EXAM_PASS_RATIO) + '/' + ex.questions.length + ' bonnes reponses.</p></div>';
  html += '<div class="quiz" id="examQuiz">';
  
  ex.questions.forEach(function(q, i){
    html += '<div class="q" data-qi="' + i + '"><b>Q' + (i+1) + '. ' + q.q + '</b>';
    q.a.forEach(function(opt, j){
      html += '<label><input type="radio" name="exam_q' + i + '" value="' + j + '"> ' + opt + '</label>';
    });
    html += '<div class="exp" id="exam_exp' + i + '"></div></div>';
  });
  
  html += '</div><div class="nav"><button class="sec" onclick="render()">Annuler</button><button class="exam" onclick="submitExam()">Valider l\'examen</button></div><div id="exam_res"></div></div>';
  
  app.innerHTML = html;
  window.scrollTo(0,0);
}

function submitExam(){
  if (!currentExam) return;
  var ex = currentExam;
  var correct = 0;
  var details = [];
  
  ex.questions.forEach(function(q, i){
    var sel = document.querySelector('input[name="exam_q' + i + '"]:checked');
    var labels = document.querySelectorAll('input[name="exam_q' + i + '"]');
    labels.forEach(function(inp, j){
      var lbl = inp.parentElement;
      if (j === q.c) lbl.classList.add('ok');
      if (sel && +sel.value === j && j !== q.c) lbl.classList.add('ko');
    });
    var exp = document.getElementById('exam_exp' + i);
    exp.style.display = 'block';
    exp.innerHTML = q.e;
    var ok = sel && +sel.value === q.c;
    if (ok) correct++;
    details.push({q: q.q, ok: ok, correct: q.a[q.c], chosen: sel ? q.a[+sel.value] : '(aucune)'});
  });
  
  var ratio = correct / ex.questions.length;
  var passed = ratio >= EXAM_PASS_RATIO;
  var existing = state.exams[ex.id];
  if (!existing || !existing.passed || correct > existing.score) {
    state.exams[ex.id] = {score: correct, total: ex.questions.length, passed: passed, date: new Date().toISOString()};
    save();
  }
  
  var msg = '';
  if (passed) {
    msg = '<div class="res g">Examen REUSSI ! ' + correct + '/' + ex.questions.length + ' (' + Math.round(ratio*100) + '%)</div>';
    if (!existing || !existing.passed) {
      msg += '<div class="res g" style="margin-top:8px">Felicitations, module valide !</div>';
    }
  } else {
    msg = '<div class="res r">Examen echoue : ' + correct + '/' + ex.questions.length + ' (' + Math.round(ratio*100) + '%)</div>';
  }
  
  msg += '<div class="card" style="margin-top:12px"><h3>Detail des reponses</h3><table><tr><th>#</th><th>Question</th><th>Votre reponse</th><th>Bonne reponse</th><th>Statut</th></tr>';
  details.forEach(function(d, i){
    msg += '<tr><td>' + (i+1) + '</td><td>' + d.q + '</td><td>' + d.chosen + '</td><td>' + d.correct + '</td><td style="color:' + (d.ok?'#22c55e':'#ef4444') + '">' + (d.ok?'OK':'KO') + '</td></tr>';
  });
  msg += '</table></div>';
  
  msg += '<div class="nav"><button class="sec" onclick="render()">Accueil</button><button class="exam" onclick="startExam(\'' + ex.id + '\')">Repasser</button></div>';
  
  document.getElementById('exam_res').innerHTML = msg;
  updateProg();
  window.scrollTo(0, document.body.scrollHeight - 400);
}

function showCerts(){
  var total = countTotal();
  var html = '<div class="card"><button class="sec" onclick="render()">Accueil</button><h2>Certifications Niveau 7 Architecte</h2>';
  CERT_PLAN.forEach(function(p){
    var status = total >= p.seuil ? 'done' : '';
    var badge = p.type === 'free' ? 'free' : (p.type === 'partial' ? 'partial' : 'paid');
    var badgeTxt = p.type === 'free' ? 'GRATUIT' : (p.type === 'partial' ? 'PARTIEL' : 'PAYANT');
    var exam = EXAMS.filter(function(e){ return e.to === p.seuil; })[0];
    var examPassed = exam && isExamPassed(exam);
    html += '<div class="cert ' + status + '"><h4>' + p.titre + ' - ' + p.modules + '</h4><div style="font-size:0.85em;color:#fbbf24;font-weight:700;margin:4px 0">' + p.seuil + ' defis minimum</div><div style="font-weight:700;margin:4px 0">' + p.cert + ' <span class="badge ' + badge + '">' + badgeTxt + '</span></div><div style="font-size:0.85em;color:#94a3b8;margin-top:6px">' + p.desc + '</div><div style="margin-top:8px"><a href="' + p.url + '" target="_blank">Site officiel</a></div>' + (status==='done'?'<div style="color:#86efac;font-weight:700;margin-top:8px">Debloquee' + (examPassed ? ' ✓ Examen reussi' : ' (examen a passer)') + '</div>':'<div style="color:#94a3b8;margin-top:8px">Encore ' + (p.seuil-total) + ' defis</div>') + '</div>';
  });
  html += '</div>';
  app.innerHTML = html;
}

function showStats(){
  var total = countTotal(), today = countToday();
  var milestonesDone = MILESTONES.filter(function(m){ return state.done[m.seuil]; });
  
  var html = '<div class="card"><button class="sec" onclick="render()">Accueil</button><h2>Statistiques</h2>';
  html += '<div class="stats-grid"><div class="stat"><span class="big">' + today + '</span><span class="lbl">Aujourdhui</span></div><div class="stat"><span class="big">' + total + '/100</span><span class="lbl">Total</span></div><div class="stat"><span class="big">' + passedExamsCount() + '/5</span><span class="lbl">Examens</span></div></div>';
  
  html += '<h3>Examens de module</h3>';
  html += '<table><tr><th>Examen</th><th>Score</th><th>Statut</th></tr>';
  EXAMS.forEach(function(ex){
    var r = state.exams && state.exams[ex.id];
    var statut = r ? (r.passed ? 'REUSSI' : 'ECHOUE') : 'Non passe';
    var color = r ? (r.passed ? '#22c55e' : '#ef4444') : '#94a3b8';
    html += '<tr><td>' + ex.titre + '</td><td>' + (r ? r.score + '/' + r.total : '-') + '</td><td style="color:' + color + ';font-weight:700">' + statut + '</td></tr>';
  });
  html += '</table>';
  
  html += '<h3>Projets majeurs atteints</h3>';
  if (milestonesDone.length === 0) {
    html += '<p style="color:#94a3b8">Aucun projet majeur encore atteint.</p>';
  } else {
    html += '<ul>';
    milestonesDone.forEach(function(m){ html += '<li><b>' + m.titre + '</b> - ' + m.date + '<br><span style="color:#94a3b8;font-size:0.85em">' + m.desc + '</span></li>'; });
    html += '</ul>';
  }
  html += '</div>';
  app.innerHTML = html;
}

function showJobs(){
  var html = '<div class="card"><button class="sec" onclick="render()">Accueil</button><h2>Emplois Architecte</h2>';
  JOBS.forEach(function(j){
    html += '<div class="job"><h4>' + j.nom + '</h4><div style="font-size:0.75em;color:#94a3b8">' + j.type + '</div><div style="margin:6px 0;font-size:0.88em">' + j.desc + '</div><a href="' + j.url + '" target="_blank">' + j.url + '</a></div>';
  });
  html += '</div>';
  app.innerHTML = html;
}

function reset(){
  if (confirm('Reinitialiser toute la progression du Niveau 7 ?')) {
    localStorage.removeItem('cyber_ci_lvl7');
    location.reload();
  }
}

render();
</script>
